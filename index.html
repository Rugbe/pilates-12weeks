hips up and back into an inverted V, then lower to plank.", "plank dog"], "side": ["Side plank", ["t", 2, 20, " per side"], "Support on forearm or hand, lift the hips, top arm to the ceiling. Straight body line. Knees down if needed.", "sideplank"], "rolldn": ["Roll-down", ["r", 2, 6, ""], "Nod the chin, roll down one vertebra at a time, soft knees. Stack back up slowly.", "stand roll_mid roll_down"], "mer": ["Mermaid side stretch", ["r", 2, 6, " per side"], "Sit tall, legs folded. Reach one arm overhead and lengthen sideways. Inhale grow, exhale bend.", "mermaid"]},STAT={"rib": ["Rib breathing", "1 minute", "On your back, knees bent, hands on your ribs. Breathe in and feel the ribs widen; out slowly.", "supine"], "cat": ["Cat-cow", "8 reps", "Exhale: round the back, tuck the chin. Inhale: lengthen, lift the chest.", "cat cow"], "tilt": ["Pelvic tilts", "8 reps", "Exhale: flatten the lower back into the mat. Inhale: back to neutral.", "supine supine_tilt"], "bridge": ["Glute bridge", "8 reps", "Peel the spine off the mat up to the shoulders, squeeze the glutes, roll down slowly.", "supine bridge"], "shr": ["Shoulder rolls and arm circles", "8 each way", "Stand tall. Roll the shoulders back and down, then small smooth arm circles.", "shoulders"], "bird": ["Bird-dog", "5 per side", "Reach opposite arm and leg long, hips level.", "quad birddog"], "squat": ["Bodyweight squat", "8 reps", "Sit the hips back, chest open, knees over toes.", "stand squat"], "roll": ["Roll-down", "5 reps", "Nod the chin and roll down one vertebra at a time, soft knees; roll back up slowly.", "stand roll_mid roll_down"], "calf": ["Calf raises", "10 reps", "Rise to the toes, pause, lower slowly.", "stand calf"], "thread": ["Thread the needle", "5 per side", "From hands and knees, reach one arm up, then thread it under the body. Breathe.", "thread_open thread_through"], "swanw": ["Swan prep", "5 reps", "Face down, press into the hands to lift the chest and lengthen the spine.", "swan"], "child": ["Child's pose", "1 minute", "Sit back toward your heels, arms long. Breathe into your back.", "child"], "twist": ["Supine spine twist", "30 s per side", "Arms in a T, knees together; drop the knees to one side. (Seen from above.)", "twistL twistR"], "hip": ["Hip flexor stretch", "30 s per side", "Low lunge. Tuck the pelvis under and shift slightly forward.", "lunge"], "fold": ["Seated forward fold", "45 seconds", "Legs long. Curve forward like a C and let the head hang; breathe.", "spinestretch"], "rest": ["Rest", "1 minute", "Lie flat, legs long, arms by your sides. Breathe slowly.", "relax"], "fig4": ["Figure-4 stretch", "30 s per side", "On your back, cross one ankle over the opposite knee and draw the legs toward you.", "fig4"], "dog": ["Downward dog", "30 seconds", "Hips high, heels reaching down, press the floor away. Pedal the feet if you like.", "plank dog"], "chest": ["Chest opener", "30 seconds", "Clasp hands behind you, squeeze the shoulder blades, lift the chest.", "chest"], "neck": ["Neck stretch", "30 s per side", "Ear toward shoulder with a light hand weight, then chin toward armpit.", "neck"], "mermaid": ["Mermaid side stretch", "6 per side", "Sit tall, legs folded. Reach one arm overhead and lengthen sideways.", "mermaid"]},PLAN=[[{"t": "Core control", "s": "Breathing and deep core basics.", "m": "hundredP deadbug sls rollupA bhold birdh"}, {"t": "Lower base", "s": "Hips, thighs and calves.", "m": "squats clam sbridge sidel scalf wall"}, {"t": "Posture and shoulders", "s": "Gentle upper-body strength.", "m": "kplank thr taps swan wangel ytw"}, {"t": "Mobility and balance", "s": "Flow, balance and side work.", "m": "rolldn p2c mer bal side sqcalf"}, {"t": "Mix", "s": "A bit of everything.", "m": "circ twistM super kick birdh swan"}], [{"t": "Head-lifted core", "s": "Classic Pilates core work.", "m": "hundred rollup slsup criss deadbug ball"}, {"t": "Strength", "s": "Lunges and single-leg work.", "m": "lunge squats sbridge kick wall sidel"}, {"t": "Push and pull", "s": "Push-ups, swimming and planks.", "m": "kpush swim wangel plank taps super"}, {"t": "Conditioning", "s": "Cardio-flavoured full body.", "m": "sqcalf climb pdog lunge side bal"}, {"t": "Mix", "s": "Teaser, swimming and mobility.", "m": "teaser circ bhold swim twistM super"}], [{"t": "Core power", "s": "Full classic versions.", "m": "hundred rollup criss teaser ball climb"}, {"t": "Lower-body strength", "s": "Longer holds, more control.", "m": "lunge wall sqcalf scalf sbridge hipA"}, {"t": "Upper body", "s": "Push-ups and plank work.", "m": "pushup swim plank taps ytw p2c"}, {"t": "Conditioning", "s": "Your hardest full-body day.", "m": "climb pdog lunge side bal rolldn"}, {"t": "Mix", "s": "Finish the week strong.", "m": "teaser circ bhold swim super twistM"}]],WA=["rib cat tilt bridge shr", "cat bird squat roll calf", "shr cat thread rib swanw", "rib roll cat squat shr", "cat tilt thread roll rib"],WB=["cat tilt rib roll shr", "rib cat bird bridge squat", "cat rib shr thread bird", "cat tilt squat roll calf", "rib bridge cat shr roll"],CA=["child twist hip fold rest", "fig4 hip child dog rest", "chest child dog neck rest", "mermaid hip fold child rest", "fig4 twist chest child rest"],CB=["fig4 hip child neck rest", "hip fold twist child rest", "dog chest neck child rest", "twist fig4 mermaid child rest", "dog hip fold twist rest"];
let tint;const fmt=s=>s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):s+" s";
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
function startTimer(b){clearInterval(tint);document.querySelectorAll(".tm").forEach(x=>x.textContent="Start timer - "+fmt(+x.dataset.t));let s=+b.dataset.t;b.textContent=fmt(s)+" - tap to restart";tint=setInterval(()=>{s--;if(s<=0){clearInterval(tint);b.textContent="Time! Switch side or mark done";beep();return}b.textContent=fmt(s)+" - tap to restart"},1000)}
let tk=0;setInterval(()=>{tk++;document.querySelectorAll(".pic").forEach(p=>{const s=p.children;if(s.length>1)for(let i=0;i<s.length;i++)s[i].classList.toggle("on",i==tk%s.length)})},1200);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const PHN=[["Foundation","Learn the movements, breathing and control. Easier variations."],["Build","More reps, harder variations, push-ups and lunges."],["Challenge","Third rounds, longer holds and the full classic versions."]];
const tm=d=>{const m=/^(?:\d+ x )?(?:\d+-)?(\d+) ?(seconds|s|minutes?)\b/.exec(d);return m?+m[1]*(m[2][0]=="m"?60:1):0};
const lv=w=>{const p=w>>2,i=w%4,rec=i==3&&w<11;return{p,rec,L:p*3+(rec?0:Math.min(i,2))}};
function mn(k,L,rec){const[n,[t,a,b,s],c,f]=MAIN[k];let d,x=0;
if(t=="s")d=a;else if(t=="r"){const r=Math.max(1,a+(L>=6?1:0)-(rec?1:0));d=r+(r>1?" rounds":" round")+" x "+Math.min(b+L,20)+s}else{x=b+3*L;d=a+" x "+x+" seconds"+s}
return x?[n,d,c,f,x]:[n,d,c,f]}
function st(k){const[n,d,c,f]=STAT[k],x=tm(d);return x?[n,d,c,f,x]:[n,d,c,f]}
let wk=Math.min(11,+ls("pw")||0),day=Math.min(4,+ls("pd")||0),done={};try{done=JSON.parse(ls("pdone")||"{}")}catch(e){}
const pre=(w,d)=>w+"."+d+".",cnt=(w,d)=>Object.keys(done).filter(k=>done[k]&&k.startsWith(pre(w,d))).length;

const sec=(t,l,p)=>`<h2>${t}</h2>`+l.map((e,i)=>card(pre(wk,day)+p+i,i,e)).join("");
function render(){clearInterval(tint);const{p,rec,L}=lv(wk),D=PLAN[p][day],wm=(p==1?WB:WA)[day].split(" ").map(st),cm=(p==1?CB:CA)[day].split(" ").map(st),mm=D.m.split(" ").map(k=>mn(k,L,rec)),tot=wm.length+mm.length+cm.length,n=cnt(wk,day);
document.getElementById("wk").innerHTML=Array.from({length:12},(_,w)=>`<button class="${w==wk?"on":""}" data-w="${w}">Wk ${w+1}${[0,1,2,3,4].every(d=>cnt(w,d)>=tot)?" &#10003;":""}</button>`).join("");
document.getElementById("chips").innerHTML=[0,1,2,3,4].map(d=>`<button class="${d==day?"on":""}" data-d="${d}">Day ${d+1}${cnt(wk,d)>=tot?" &#10003;":""}</button>`).join("");
const note=rec?"Recovery week: one round fewer, same exercises. Let the body adapt.":wk==11?"Final week: your best form. Compare your holds with week 1.":"";
document.getElementById("m").innerHTML=`<div class="info"><b>Phase ${p+1}: ${PHN[p][0]}</b> (weeks ${p*4+1}-${p*4+4})<br>${PHN[p][1]}${note?"<br><i>"+note+"</i>":""}</div><h2 style="margin-top:12px">Week ${wk+1}, Day ${day+1}: ${D.t}</h2><p class="sub">${D.s} About ${p==2?"30-35":"30"} minutes.</p>`+sec("Warm-up - 5 min",wm,"w")+sec("Main work",mm,"m")+sec("Cool-down - 5 min",cm,"c")+`<p class="note">Stop if you feel sharp pain. The figures animate between positions and the orange arrows show the direction of movement. Tap the timer on timed exercises.</p><button class="rs" data-r="1">Reset this day</button>`;
const all=Object.keys(done).filter(k=>done[k]).length;
document.getElementById("bar").style.width=n/tot*100+"%";document.getElementById("pc").textContent=n+" of "+tot+" done today | "+Math.round(all/(12*5*tot)*100)+"% of the program";
document.querySelectorAll(".pic").forEach(q=>q.firstElementChild.classList.add("on"));const o=document.querySelector("#wk .on");o&&o.scrollIntoView({inline:"center",block:"nearest"})}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const y=window.scrollY;
if(b.dataset.t){startTimer(b);return}
if(b.dataset.w){wk=+b.dataset.w;ls("pw",wk);render();scrollTo(0,0);return}
if(b.dataset.d){day=+b.dataset.d;ls("pd",day);render();scrollTo(0,0);return}
if(b.dataset.k){done[b.dataset.k]=!done[b.dataset.k];ls("pdone",JSON.stringify(done))}
if(b.dataset.r){Object.keys(done).forEach(k=>{if(k.startsWith(pre(wk,day)))delete done[k]});ls("pdone",JSON.stringify(done))}
render();scrollTo(0,y)});
render();
